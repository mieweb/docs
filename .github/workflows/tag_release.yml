name: Released a tag - Deploy to Production

on:
  push:
    tags:
      - "*"

jobs:
  build:
    # The type of runner that the job will run on
    runs-on: [self-hosted, docsqa]

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          lfs: "true"
          clean: "true"
          fetch-depth: 0

      - name: Pull NPM Dependencies
        run: ./setup.sh

      - name: Build WebChart HTML
        run: ./build.sh --minify --baseURL https://docs.webchartnow.com/ wc

      - name: Build Enterprise Health HTML
        run: ./build.sh --minify --baseURL https://docs.enterprisehealth.com/ eh

      - name: "Deploy built documentation to production folder"
        run: |
          for attempt in 1 2 3; do
            if rsync -ruva --delete -e "ssh -o ConnectTimeout=30" public deploy@wc-docs.med-web.com:/www/docrootssl/docs; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Deployment failed (attempt $attempt/3); retrying in 15 seconds..." >&2
              sleep 15
            fi
          done
          echo "Deployment failed after 3 attempts." >&2
          exit 1

      - name: Rocket.Chat Notification
        uses: wreiske/Rocket.Chat.GitHub.Action.Notification@1.5.1
        if: always()
        with:
          type: ${{ job.status }}
          job_name: "*Publish to Production*"
          mention: "here"
          channel: "#miedocs"
          url: ${{ secrets.ROCKETCHAT_WEBHOOK }}
          commit: true
          token: ${{ github.token }}
